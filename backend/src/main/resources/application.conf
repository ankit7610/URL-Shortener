# Application configuration
app-name = "URL Shortener"
app-name = ${?APP_NAME}

app-version = "1.0.0"
app-version = ${?APP_VERSION}

environment = "development"
environment = ${?ENVIRONMENT}

debug = true
debug = ${?DEBUG}

base-url = "http://localhost:8000"
base-url = ${?BASE_URL}

allowed-origins = ["http://localhost:3000"]
allowed-origins = ${?ALLOWED_ORIGINS}

# Database configuration
database {
  url = "jdbc:postgresql://localhost:5432/urlshortener?user=urlshortener&password=urlshortener"
  url = ${?DATABASE_URL}
  
  pool-size = 20
  pool-size = ${?DATABASE_POOL_SIZE}
  
  max-overflow = 10
  max-overflow = ${?DATABASE_MAX_OVERFLOW}
}

# Redis configuration
redis {
  url = "redis://localhost:6379"
  url = ${?REDIS_URL}
  
  max-connections = 10
  max-connections = ${?REDIS_MAX_CONNECTIONS}
}

# JWT configuration
jwt {
  secret-key = "dev-secret-key-change-in-production"
  secret-key = ${?JWT_SECRET_KEY}
  
  algorithm = "HS256"
  algorithm = ${?JWT_ALGORITHM}
  
  access-token-expire-minutes = 30
  access-token-expire-minutes = ${?JWT_ACCESS_TOKEN_EXPIRE_MINUTES}
  
  refresh-token-expire-days = 7
  refresh-token-expire-days = ${?JWT_REFRESH_TOKEN_EXPIRE_DAYS}
}

# Security configuration
security {
  rate-limit-per-minute = 60
  rate-limit-per-minute = ${?RATE_LIMIT_PER_MINUTE}
  
  rate-limit-per-hour = 1000
  rate-limit-per-hour = ${?RATE_LIMIT_PER_HOUR}
  
  password-min-length = 8
  password-min-length = ${?PASSWORD_MIN_LENGTH}
}

# URL configuration
url {
  short-url-length = 7
  short-url-length = ${?SHORT_URL_LENGTH}
  
  custom-alias-min-length = 3
  custom-alias-min-length = ${?CUSTOM_ALIAS_MIN_LENGTH}
  
  custom-alias-max-length = 50
  custom-alias-max-length = ${?CUSTOM_ALIAS_MAX_LENGTH}
}

# Cache configuration
cache {
  ttl-hot-url = 3600
  ttl-hot-url = ${?CACHE_TTL_HOT_URL}
  
  ttl-analytics = 300
  ttl-analytics = ${?CACHE_TTL_ANALYTICS}
}

# Optional services
sentry-dsn = ${?SENTRY_DSN}
geoip-database-path = ${?GEOIP_DATABASE_PATH}
